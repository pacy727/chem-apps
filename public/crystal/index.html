}

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        const ATOM_RADIUS_BALL_STICK = 0.3;
        const COLORS = { 
            metal: new THREE.Color(0xb0b0b0), 
            cell: 0x333333,
            cs: 0x4f46e5,   // Cs⁺ - 青紫
            cl: 0x10b981,   // Cl⁻ - 緑
            na: 0x3b82f6,   // Na⁺ - 青
            zn: 0xf59e0b,   // Zn²⁺ - 黄
            s: 0xef4444     // S²⁻ - 赤
        };

        const ION_RADII = {
            cs: 1.67,   // Cs⁺
            cl: 1.81,   // Cl⁻
            na: 1.02,   // Na⁺
            zn: 0.74,   // Zn²⁺
            s: 1.84     // S²⁻
        };

        const state = { 
            crystalType: 'metal',
            crystal: 'bcc', 
            model: 'ballAndStick', 
            activeObjects: [] 
        };
        let scene, camera, renderer, controls;

        const canvas = document.getElementById('canvas-3d');
        const loader = document.getElementById('loader');
        const infoPanel = document.getElementById('info-panel-container');

        function createClippingCaps(position, radius, clippingPlanes) {
            const caps = new THREE.Group();
            
            clippingPlanes.forEach(plane => {
                const distance = plane.distanceToPoint(position);
                
                if (Math.abs(distance) < radius) {
                    const capCenter = position.clone().add(plane.normal.clone().multiplyScalar(-distance));
                    const capRadius = Math.sqrt(radius * radius - distance * distance);
                    
                    const capGeometry = new THREE.CylinderGeometry(capRadius, capRadius, 0.008, 32);
                    const capMaterial = new THREE.MeshStandardMaterial({
                        color: COLORS.metal,
                        metalness: 0.3,
                        roughness: 0.5,
                        side: THREE.DoubleSide
                    });
                    
                    const cap = new THREE.Mesh(capGeometry, capMaterial);
                    cap.position.copy(capCenter);
                    
                    const quaternion = new THREE.Quaternion();
                    quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), plane.normal);
                    cap.setRotationFromQuaternion(quaternion);
                    
                    caps.add(cap);
                }
            });
            
            return caps;
        }

        function createCubicClippingPlanes(halfSize) {
            const h = halfSize;
            return [
                new THREE.Plane(new THREE.Vector3(1, 0, 0), h),
                new THREE.Plane(new THREE.Vector3(-1, 0, 0), h),
                new THREE.Plane(new THREE.Vector3(0, 1, 0), h),
                new THREE.Plane(new THREE.Vector3(0, -1, 0), h),
                new THREE.Plane(new THREE.Vector3(0, 0, 1), h),
                new THREE.Plane(new THREE.Vector3(0, 0, -1), h)
            ];
        }

        function createHexagonalClippingPlanes(radius, halfHeight) {
            const planes = [
                new THREE.Plane(new THREE.Vector3(0, 1, 0), halfHeight),
                new THREE.Plane(new THREE.Vector3(0, -1, 0), halfHeight)
            ];
            
            const apothem = radius * Math.cos(Math.PI / 6);
            for (let i = 0; i < 6; i++) {
                const angle = i * Math.PI / 3;
                const normal = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
                planes.push(new THREE.Plane(normal, apothem));
            }
            return planes;
        }

        const CRYSTAL_DATA = {
            bcc: {
                createGeometry: () => {
                    const s = 2, h = s / 2;
                    const radius = state.model === 'spaceFilling' ? (Math.sqrt(3) / 4) * s : ATOM_RADIUS_BALL_STICK;
                    createUnitCellBox(s);
                    const positions = [
                        new THREE.Vector3(-h, -h, -h), new THREE.Vector3(h, -h, -h), new THREE.Vector3(-h, h, -h), new THREE.Vector3(h, h, -h),
                        new THREE.Vector3(-h, -h, h), new THREE.Vector3(h, -h, h), new THREE.Vector3(-h, h, h), new THREE.Vector3(h, h, h),
                        new THREE.Vector3(0, 0, 0)
                    ];
                    
                    if (state.model === 'spaceFilling') {
                        const clippingPlanes = createCubicClippingPlanes(h);
                        renderer.clippingPlanes = clippingPlanes;
                        const material = new THREE.MeshStandardMaterial({
                            color: COLORS.metal, 
                            metalness: 0.3, 
                            roughness: 0.5,
                            side: THREE.DoubleSide
                        });
                        positions.forEach(p => createAtom(p, radius, material));
                    } else {
                        renderer.clippingPlanes = [];
                        positions.forEach(p => createAtom(p, radius));
                    }
                },
                infoHTML: `
                    <h3 class="text-xl font-bold mb-3">体心立方格子 (BCC)</h3>
                    <div class="space-y-4">
                        <div><h4 class="font-semibold p-2 bg-indigo-50 rounded-lg">格子中に含まれる原子数</h4><p class="mt-2 p-2 bg-gray-50 rounded-md text-sm text-center">1 (体心) + 8 × <span class="fraction"><span class="num">1</span><span class="den">8</span></span> (頂点) = 2 個</p></div>
                        <div><h4 class="font-semibold p-2 bg-indigo-50 rounded-lg">配位数</h4><p class="mt-2 p-2 bg-gray-50 rounded-md text-sm text-center">8 個</p></div>
                        <div><h4 class="font-semibold p-2 bg-indigo-50 rounded-lg">格子一辺 <span class="latex">a</span> と原子半径 <span class="latex">r</span> の関係</h4><div class="mt-2 p-2 bg-gray-50 rounded-md text-sm space-y-2 text-center"><p class="font-mono text-base">√3<span class="latex">a</span> = 4<span class="latex">r</span></p></div></div>
                        <div><h4 class="font-semibold text-lg mb-2">充填率</h4><div class="text-sm space-y-2 p-2 bg-gray-50 rounded-md"><p>充填率 = <span class="fraction"><span class="num">原子の体積 (2個分)</span><span class="den">単位格子の体積</span></span> = <span class="fraction"><span class="num">2 × ⁴/₃πr³</span><span class="den">a³</span></span></p><p class="font-bold text-indigo-700 text-base text-center">≈ 68%</p></div></div>
                        <div><h4 class="font-semibold text-lg mb-2">金属例</h4><p class="text-sm p-2 bg-gray-50 rounded-md">Na, K, Fe(α鉄)</p></div>
                    </div>`
            },
            fcc: {
                createGeometry: () => {
                    const s = 2, h = s / 2;
                    const radius = state.model === 'spaceFilling' ? (Math.sqrt(2) / 4) * s : ATOM_RADIUS_BALL_STICK;
                    createUnitCellBox(s);
                    const positions = [
                        ...[[-h,h],[-h,-h],[h,-h],[h,h]].flatMap(([x,y]) => [[x,y,-h],[x,y,h]]),
                        ...[[h,0,0],[-h,0,0],[0,h,0],[0,-h,0],[0,0,h],[0,0,-h]]
                    ].map(p => new THREE.Vector3(...p));
                    
                    if (state.model === 'spaceFilling') {
                        const clippingPlanes = createCubicClippingPlanes(h);
                        renderer.clippingPlanes = clippingPlanes;
                        const material = new THREE.MeshStandardMaterial({
                            color: COLORS.metal, 
                            metalness: 0.3, 
                            roughness: 0.5,
                            side: THREE.DoubleSide
                        });
                        positions.forEach(p => createAtom(p, radius, material));
                    } else {
                        renderer.clippingPlanes = [];
                        positions.forEach(p => createAtom(p, radius));
                    }
                },
                infoHTML: `
                    <h3 class="text-xl font-bold mb-3">面心立方格子 (FCC)</h3>
                    <div class="space-y-4">
                        <div><h4 class="font-semibold p-2 bg-indigo-50 rounded-lg">格子中に含まれる原子数</h4><p class="mt-2 p-2 bg-gray-50 rounded-md text-sm text-center">6 × <span class="fraction"><span class="num">1</span><span class="den">2</span></span> (面心) + 8 × <span class="fraction"><span class="num">1</span><span class="den">8</span></span> (頂点) = 4 個</p></div>
                        <div><h4 class="font-semibold p-2 bg-indigo-50 rounded-lg">配位数</h4><p class="mt-2 p-2 bg-gray-50 rounded-md text-sm text-center">12 個</p></div>
                        <div><h4 class="font-semibold p-2 bg-indigo-50 rounded-lg">格子一辺 <span class="latex">a</span> と原子半径 <span class="latex">r</span> の関係</h4><div class="mt-2 p-2 bg-gray-50 rounded-md text-sm space-y-2 text-center"><p class="font-mono text-base">√2<span class="latex">a</span> = 4<span class="latex">r</span></p></div></div>
                        <div><h4 class="font-semibold text-lg mb-2">充填率</h4><div class="text-sm space-y-2 p-2 bg-gray-50 rounded-md"><p>充填率 = <span class="fraction"><span class="num">原子の体積 (4個分)</span><span class="den">単位格子の体積</span></span> = <span class="fraction"><span class="num">4 × ⁴/₃πr³</span><span class="den">a³</span></span></p><p class="font-bold text-indigo-700 text-base text-center">≈ 74%</p></div></div>
                        <div><h4 class="font-semibold text-lg mb-2">金属例</h4><p class="text-sm p-2 bg-gray-50 rounded-md">Al, Cu, Ag, Au (最密充填)</p></div>
                    </div>`
            },
            hcp: {
    createGeometry: () => {
        const a = 2, c = a * Math.sqrt(8/3), h = c/2;
        const radius = state.model === 'spaceFilling' ? a / 2 : ATOM_RADIUS_BALL_STICK;
        createHexagonalPrism(a, c);
        
        const positions = [];
        
        if (state.model === 'spaceFilling') {
            // 空間充填モデル用（現行のまま、π/6補正なし）
            [-h, h].forEach(y => {
                for(let i=0; i<6; i++) {
                    positions.push(new THREE.Vector3(a * Math.cos(i * Math.PI/3), y, a * Math.sin(i * Math.PI/3)));
                }
                positions.push(new THREE.Vector3(0, y, 0));
            });
            for(let i=0; i<3; i++) {
                const angle = (i * 2 * Math.PI / 3) + (Math.PI / 6);
                positions.push(new THREE.Vector3(a / Math.sqrt(3) * Math.cos(angle), 0, a / Math.sqrt(3) * Math.sin(angle)));
            }
        } else {
            // 球棒モデル用（π/6補正あり）
            [-h, h].forEach(y => {
                for(let i=0; i<6; i++) {
                    const angle = (i * Math.PI / 3) + (Math.PI / 6);  // π/6を追加
                    positions.push(new THREE.Vector3(a * Math.cos(angle), y, a * Math.sin(angle)));
                }
                positions.push(new THREE.Vector3(0, y, 0));
            });
            for(let i=0; i<3; i++) {
                const angle = (i * 2 * Math.PI / 3) + (Math.PI / 6);
                positions.push(new THREE.Vector3(a / Math.sqrt(3) * Math.cos(angle), 0, a / Math.sqrt(3) * Math.sin(angle)));
            }
        }

        if (state.model === 'spaceFilling') {
            const clippingPlanes = createHexagonalClippingPlanes(a, h);
            renderer.clippingPlanes = clippingPlanes;
            const material = new THREE.MeshStandardMaterial({
               color: COLORS.metal, 
               metalness: 0.3, 
               roughness: 0.5,
               side: THREE.DoubleSide
            });
            positions.forEach(p => createAtom(p, radius, material));
        } else {
            renderer.clippingPlanes = [];
            positions.forEach(p => createAtom(p, radius));
        }
    },
                infoHTML: `
                    <h3 class="text-xl font-bold mb-3">六方最密構造 (HCP)</h3>
                    <div class="space-y-4">
                        <div><h4 class="font-semibold p-2 bg-indigo-50 rounded-lg">格子中に含まれる原子数</h4><p class="mt-2 p-2 bg-gray-50 rounded-md text-sm text-center">12 × <span class="fraction"><span class="num">1</span><span class="den">6</span></span> (頂点) + 2 × <span class="fraction"><span class="num">1</span><span class="den">2</span></span> (面心) + 3 (内部) = 6 個</p></div>
                        <div><h4 class="font-semibold p-2 bg-indigo-50 rounded-lg">配位数</h4><p class="mt-2 p-2 bg-gray-50 rounded-md text-sm text-center">12 個</p></div>
                        <div><h4 class="font-semibold p-2 bg-indigo-50 rounded-lg">格子一辺 <span class="latex">a</span> と原子半径 <span class="latex">r</span> の関係</h4><div class="mt-2 p-2 bg-gray-50 rounded-md text-sm space-y-2 text-center"><p class="font-mono text-base">a = 2r</p></div></div>
                        <div><h4 class="font-semibold text-lg mb-2">充填率</h4><div class="text-sm space-y-2 p-2 bg-gray-50 rounded-md"><p>面心立方格子と同じく、空間を最も密に埋める方法の一つです。</p><p class="text-xs mt-2">※ このモデルは六角柱で、原子6個分を含みます。本来の単位格子は原子2個分です。</p><p class="font-bold text-indigo-700 text-base text-center">≈ 74%</p></div></div>
                        <div><h4 class="font-semibold text-lg mb-2">金属例</h4><p class="text-sm p-2 bg-gray-50 rounded-md">Be, Mg, Zn</p></div>
                    </div>`
            },
            
            cscl: {
                createGeometry: () => {
                    const s = 2, h = s / 2;
                    createUnitCellBox(s);
                    renderer.clippingPlanes = [];
                    
                    const csPositions = [new THREE.Vector3(0, 0, 0)];
                    const clPositions = [
                        new THREE.Vector3(-h, -h, -h), new THREE.Vector3(h, -h, -h),
                        new THREE.Vector3(-h, h, -h), new THREE.Vector3(h, h, -h),
                        new THREE.Vector3(-h, -h, h), new THREE.Vector3(h, -h, h),
                        new THREE.Vector3(-h, h, h), new THREE.Vector3(h, h, h)
                    ];
                    
                    const baseRadius = ATOM_RADIUS_BALL_STICK;
                    const csRadius = baseRadius * (ION_RADII.cs / ION_RADII.cl);
                    const clRadius = baseRadius;
                    
                    csPositions.forEach(p => createIon(p, csRadius, COLORS.cs));
                    clPositions.forEach(p => createIon(p, clRadius, COLORS.cl));
                    
                    if (state.model === 'ballAndStick') {
                        csPositions.forEach(csPos => {
                            clPositions.forEach(clPos => {
                                createBond(csPos, clPos);
                            });
                        });
                    }
                },
                infoHTML: `
                    <h3 class="text-xl font-bold mb-3">塩化セシウム型 (CsCl型)</h3>
                    <div class="space-y-4">
                        <div><h4 class="font-semibold p-2 bg-indigo-50 rounded-lg">単位格子に含まれるイオン数</h4><p class="mt-2 p-2 bg-gray-50 rounded-md text-sm text-center">Cs⁺: 1個（体心）<br>Cl⁻: 8 × <span class="fraction"><span class="num">1</span><span class="den">8</span></span> (頂点) = 1個</p></div>
                        <div><h4 class="font-semibold p-2 bg-indigo-50 rounded-lg">配位数</h4><p class="mt-2 p-2 bg-gray-50 rounded-md text-sm text-center">Cs⁺: 8個, Cl⁻: 8個</p></div>
                        <div><h4 class="font-semibold text-lg mb-2">代表的な化合物</h4><p class="text-sm p-2 bg-gray-50 rounded-md">CsCl, CsBr, CsI, TlCl など</p></div>
                    </div>`
            },
            nacl: {
                createGeometry: () => {
                    const s = 2, h = s / 2;
                    createUnitCellBox(s);
                    renderer.clippingPlanes = [];
                    
                    // この2つの配列の内容を入れ替える
                    const naPositions = [
                        // 元々のclPositionsの内容をここに移動
                        // 体心のNa⁺
                        new THREE.Vector3(0, 0, 0),
                        // 稜の中点のNa⁺（12個）
                        new THREE.Vector3(h, h, 0), new THREE.Vector3(h, -h, 0),
                        new THREE.Vector3(-h, h, 0), new THREE.Vector3(-h, -h, 0),
                        new THREE.Vector3(h, 0, h), new THREE.Vector3(h, 0, -h),
                        new THREE.Vector3(-h, 0, h), new THREE.Vector3(-h, 0, -h),
                        new THREE.Vector3(0, h, h), new THREE.Vector3(0, h, -h),
                        new THREE.Vector3(0, -h, h), new THREE.Vector3(0, -h, -h)
                    ];
                    const clPositions = [
                        // 元々のnaPositionsの内容をここに移動
                        // 頂点のCl⁻
                        new THREE.Vector3(-h, -h, -h), new THREE.Vector3(h, -h, -h),
                        new THREE.Vector3(-h, h, -h), new THREE.Vector3(h, h, -h),
                        new THREE.Vector3(-h, -h, h), new THREE.Vector3(h, -h, h),
                        new THREE.Vector3(-h, h, h), new THREE.Vector3(h, h, h),
                        // 面心のCl⁻
                        new THREE.Vector3(h, 0, 0), new THREE.Vector3(-h, 0, 0),
                        new THREE.Vector3(0, h, 0), new THREE.Vector3(0, -h, 0),
                        new THREE.Vector3(0, 0, h), new THREE.Vector3(0, 0, -h)
                    ];
                    
                    const baseRadius = ATOM_RADIUS_BALL_STICK;
                    const naRadius = baseRadius * (ION_RADII.na / ION_RADII.cl);
                    const clRadius = baseRadius;
                    
                    naPositions.forEach(p => createIon(p, naRadius, COLORS.na));
                    clPositions.forEach(p => createIon(p, clRadius, COLORS.cl));
                    
                    if (state.model === 'ballAndStick') {
                        naPositions.forEach(naPos => {
                            clPositions.forEach(clPos => {
                                const distance = naPos.distanceTo(clPos);
                                if (Math.abs(distance - s/2) < 0.1) {
                                    createBond(naPos, clPos);
                                }
                            });
                        });
                    }
                },
                infoHTML: `
                        <h3 class="text-xl font-bold mb-3">塩化ナトリウム型 (NaCl型)</h3>
                        <div class="space-y-4">
                        <div><h4 class="font-semibold p-2 bg-indigo-50 rounded-lg">単位格子に含まれるイオン数</h4><p class="mt-2 p-2 bg-gray-50 rounded-md text-sm text-center">Na⁺: 1個（体心） + 12 × <span class="fraction"><span class="num">1</span><span class="den">4</span></span> (稜) = 4個<br>Cl⁻: 6 × <span class="fraction"><span class="num">1</span><span class="den">2</span></span> (面心) + 8 × <span class="fraction"><span class="num">1</span><span class="den">8</span></span> (頂点) = 4個</p></div>
                        <div><h4 class="font-semibold p-2 bg-indigo-50 rounded-lg">配位数</h4><p class="mt-2 p-2 bg-gray-50 rounded-md text-sm text-center">Na⁺: 6個, Cl⁻: 6個</p></div>
                        <div><h4 class="font-semibold text-lg mb-2">代表的な化合物</h4><p class="text-sm p-2 bg-gray-50 rounded-md">NaCl, LiF, MgO, CaO など</p></div>
                    </div>`
            },
            zns: {
                createGeometry: () => {
                    const s = 2, h = s / 2;
                    createUnitCellBox(s);
                    renderer.clippingPlanes = [];
                    
                    // ZnS型構造：S²⁻がfcc、Zn²⁺が正四面体の位置
                    const sPositions = [
                        // 頂点のS²⁻
                        new THREE.Vector3(-h, -h, -h), new THREE.Vector3(h, -h, -h),
                        new THREE.Vector3(-h, h, -h), new THREE.Vector3(h, h, -h),
                        new THREE.Vector3(-h, -h, h), new THREE.Vector3(h, -h, h),
                        new THREE.Vector3(-h, h, h), new THREE.Vector3(h, h, h),
                        // 面心のS²⁻
                        new THREE.Vector3(h, 0, 0), new THREE.Vector3(-h, 0, 0),
                        new THREE.Vector3(0, h, 0), new THREE.Vector3(0, -h, 0),
                        new THREE.Vector3(0, 0, h), new THREE.Vector3(0, 0, -h)
                    ];
                    const znPositions = [
                        // 正四面体位置のZn²⁺（4個）
                        new THREE.Vector3(-h/2, -h/2, -h/2), new THREE.Vector3(h/2, h/2, -h/2),
                        new THREE.Vector3(h/2, -h/2, h/2), new THREE.Vector3(-h/2, h/2, h/2)
                    ];
                    
                    const baseRadius = ATOM_RADIUS_BALL_STICK;
                    const znRadius = baseRadius * (ION_RADII.zn / ION_RADII.s);
                    const sRadius = baseRadius;
                    
                    sPositions.forEach(p => createIon(p, sRadius, COLORS.s));
                    znPositions.forEach(p => createIon(p, znRadius, COLORS.zn));
                    
                    if (state.model === 'ballAndStick') {
                        znPositions.forEach(znPos => {
                            sPositions.forEach(sPos => {
                                const distance = znPos.distanceTo(sPos);
                                if (distance < s * 0.47) {  // 最近接のみ（正四面体の4配位）
                                    createBond(znPos, sPos);
                                }
                            });
                        });
                    }
                },
                infoHTML: `
                    <h3 class="text-xl font-bold mb-3">閃亜鉛鉱型 (ZnS型)</h3>
                    <div class="space-y-4">
                        <div><h4 class="font-semibold p-2 bg-indigo-50 rounded-lg">単位格子に含まれるイオン数</h4><p class="mt-2 p-2 bg-gray-50 rounded-md text-sm text-center">Zn²⁺: 4個（正四面体位置）<br>S²⁻: 6 × <span class="fraction"><span class="num">1</span><span class="den">2</span></span> (面心) + 8 × <span class="fraction"><span class="num">1</span><span class="den">8</span></span> (頂点) = 4個</p></div>
                        <div><h4 class="font-semibold p-2 bg-indigo-50 rounded-lg">配位数</h4><p class="mt-2 p-2 bg-gray-50 rounded-md text-sm text-center">Zn²⁺: 4個, S²⁻: 4個</p></div>
                        <div><h4 class="font-semibold text-lg mb-2">代表的な化合物</h4><p class="text-sm p-2 bg-gray-50 rounded-md">ZnS, ZnO, GaAs, InP など</p></div>
                    </div>`
            }
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            const container = canvas.parentElement;
            camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(4, 4, 8);
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.localClippingEnabled = true;
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(ambientLight, directionalLight);
            window.addEventListener('resize', onWindowResize);
            onWindowResize();

            document.addEventListener('click', (e) => {
                const crystalTypeBtn = e.target.closest('[data-crystal-type]');
                const crystalBtn = e.target.closest('.crystal-btn');
                const modelBtn = e.target.closest('.model-btn');
                
                if (crystalTypeBtn) {
                    state.crystalType = crystalTypeBtn.dataset.crystalType;
                    if (state.crystalType === 'metal') {
                        state.crystal = 'bcc';
                    } else {
                        state.crystal = 'cscl';
                    }
                    updateCrystalTypeUI();
                    drawScene();
                }
                if (crystalBtn) { 
                    state.crystal = crystalBtn.dataset.crystal; 
                    drawScene(); 
                }
                if (modelBtn) { 
                    state.model = modelBtn.dataset.model; 
                    drawScene(); 
                }
            });

            infoPanel.innerHTML = document.getElementById('ui-template').innerHTML;
            drawScene();
            animate();
            loader.style.display = 'none';
        }

        function drawScene() {
            state.activeObjects.forEach(obj => {
                scene.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (!Array.isArray(obj.material)) obj.material.dispose();
                }
            });
            state.activeObjects = [];
            CRYSTAL_DATA[state.crystal].createGeometry();
            updateUI();
            resetCamera();
        }
        
        function updateCrystalTypeUI() {
            document.querySelectorAll('[data-crystal-type]').forEach(btn => 
                btn.classList.toggle('main-tab-active', btn.dataset.crystalType === state.crystalType));
            
            document.getElementById('metal-controls').style.display = 
                state.crystalType === 'metal' ? 'flex' : 'none';
            document.getElementById('ionic-controls').style.display = 
                state.crystalType === 'ionic' ? 'flex' : 'none';
            
            // イオン結晶では空間充填モデルボタンを非表示
            const spaceFillingBtn = document.getElementById('space-filling-btn');
            const modelLabel = spaceFillingBtn.previousElementSibling.previousElementSibling;
            const ballStickBtn = spaceFillingBtn.previousElementSibling;
            
            if (state.crystalType === 'ionic') {
                spaceFillingBtn.style.display = 'none';
                modelLabel.style.display = 'none';
                ballStickBtn.style.display = 'none';
                state.model = 'ballAndStick';
            } else {
                spaceFillingBtn.style.display = 'block';
                modelLabel.style.display = 'inline';
                ballStickBtn.style.display = 'block';
            }
            
            const ionLegend = document.getElementById('ion-legend');
            ionLegend.style.display = state.crystalType === 'ionic' ? 'block' : 'none';
            
            const metalDetails = document.getElementById('metal-details');
            const ionicDetails = document.getElementById('ionic-details');
            metalDetails.style.display = state.crystalType === 'metal' ? 'block' : 'none';
            ionicDetails.style.display = state.crystalType === 'ionic' ? 'block' : 'none';
        }
        
        function updateUI() {
            updateCrystalTypeUI();
            
            document.querySelectorAll('.crystal-btn').forEach(btn => 
                btn.classList.toggle('crystal-btn-active', btn.dataset.crystal === state.crystal));
            
            document.querySelectorAll('.model-btn').forEach(btn => 
                btn.classList.toggle('crystal-btn-active', btn.dataset.model === state.model));
            
            if (state.crystalType === 'ionic') {
                updateIonLegend();
            }
            
            const targetDetails = state.crystalType === 'metal' ? 
                document.querySelector('#metal-details') : 
                document.querySelector('#ionic-details');
            if (targetDetails) {
                targetDetails.innerHTML = CRYSTAL_DATA[state.crystal].infoHTML;
            }
        }

        function updateIonLegend() {
            const legendCation = document.getElementById('legend-cation');
            const legendAnion = document.getElementById('legend-anion');
            const legendCationText = document.getElementById('legend-cation-text');
            const legendAnionText = document.getElementById('legend-anion-text');
            
            const crystalInfo = {
                cscl: { cation: { color: COLORS.cs, text: 'Cs⁺' }, anion: { color: COLORS.cl, text: 'Cl⁻' } },
                nacl: { cation: { color: COLORS.na, text: 'Na⁺' }, anion: { color: COLORS.cl, text: 'Cl⁻' } },
                zns: { cation: { color: COLORS.zn, text: 'Zn²⁺' }, anion: { color: COLORS.s, text: 'S²⁻' } }
            };
            
            const info = crystalInfo[state.crystal];
            legendCation.style.backgroundColor = `#${info.cation.color.toString(16).padStart(6, '0')}`;
            legendAnion.style.backgroundColor = `#${info.anion.color.toString(16).padStart(6, '0')}`;
            legendCationText.textContent = info.cation.text;
            legendAnionText.textContent = info.anion.text;
        }

        function createAtom(position, radius, material) {
            const geometry = new THREE.SphereGeometry(radius, 32, 16);
            const mat = material || new THREE.MeshStandardMaterial({ color: COLORS.metal, metalness: 0.3, roughness: 0.5 });
            const atom = new THREE.Mesh(geometry, mat);
            atom.position.copy(position);
            scene.add(atom);
            state.activeObjects.push(atom);
            
            if (state.model === 'spaceFilling' && renderer.clippingPlanes && renderer.clippingPlanes.length > 0) {
                const caps = createClippingCaps(position, radius, renderer.clippingPlanes);
                scene.add(caps);
                state.activeObjects.push(caps);
            }
        }

        function createIon(position, radius, color) {
            const geometry = new THREE.SphereGeometry(radius, 32, 16);
            const material = new THREE.MeshStandardMaterial({ 
                color: color, 
                metalness: 0.2, 
                roughness: 0.6 
            });
            const ion = new THREE.Mesh(geometry, material);
            ion.position.copy(position);
            scene.add(ion);
            state.activeObjects.push(ion);
        }

        function createBond(pos1, pos2) {
            const distance = pos1.distanceTo(pos2);
            const bondGeometry = new THREE.CylinderGeometry(0.05, 0.05, distance, 8);
            const bondMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x666666, 
                metalness: 0.3, 
                roughness: 0.7 
            });
            const bond = new THREE.Mesh(bondGeometry, bondMaterial);
            
            const midpoint = new THREE.Vector3().addVectors(pos1, pos2).multiplyScalar(0.5);
            bond.position.copy(midpoint);
            
            const direction = new THREE.Vector3().subVectors(pos2, pos1).normalize();
            const quaternion = new THREE.Quaternion();
            quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
            bond.setRotationFromQuaternion(quaternion);
            
            scene.add(bond);
            state.activeObjects.push(bond);
        }

        function createUnitCellBox(size) {
            const edges = new THREE.EdgesGeometry(new THREE.BoxGeometry(size, size, size));
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: COLORS.cell, transparent: true, opacity: 0.5 }));
            scene.add(line);
            state.activeObjects.push(line);
        }

        function createHexagonalPrism(a, c) {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            
            for (let i = 0; i < 6; i++) {
                const angle = (i * Math.PI / 3) + (Math.PI / 6);  // π/6を追加
                const x = a * Math.cos(angle);
                const z = a * Math.sin(angle);
                vertices.push(x, c/2, z);
                vertices.push(x, -c/2, z);
            }
            
            vertices.push(0, c/2, 0);
            vertices.push(0, -c/2, 0);
            
            const edges = [];
            for (let i = 0; i < 6; i++) {
                edges.push(i * 2, ((i + 1) % 6) * 2);
                edges.push(i * 2 + 1, ((i + 1) % 6) * 2 + 1);
                edges.push(i * 2, i * 2 + 1);
            }
            
            const edgeGeometry = new THREE.BufferGeometry();
            const edgeVertices = [];
            
            for (let i = 0; i < edges.length; i += 2) {
                const start = edges[i];
                const end = edges[i + 1];
                edgeVertices.push(
                    vertices[start * 3], vertices[start * 3 + 1], vertices[start * 3 + 2],
                    vertices[end * 3], vertices[end * 3 + 1], vertices[end * 3 + 2]
                );
            }
            
            edgeGeometry.setAttribute('position', new THREE.Float32BufferAttribute(edgeVertices, 3));
            
            const line = new THREE.LineSegments(edgeGeometry, new THREE.LineBasicMaterial({ 
                color: COLORS.cell, 
                transparent: true, 
                opacity: 0.5 
            }));
            
            scene.add(line);
            state.activeObjects.push(line);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = canvas.parentElement;
            renderer.setSize(container.clientWidth, container.clientHeight);
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
        }

        function resetCamera() {
            controls.reset();
            const distance = state.crystal === 'hcp' ? 12 : 8;
            camera.position.set(distance * 0.7, distance * 0.5, distance);
            camera.lookAt(0, 0, 0);
        }

        init();
    </script>
